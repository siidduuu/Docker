echo 'name: Deploy Applications to EKS via Helm

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update Kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --name kubernets-practice --region ${{ secrets.AWS_REGION }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.22.0"

      - name: Deploy Application 1 - Nginx Web Server
        run: |
          helm lint ./nginx-app
          helm upgrade --install nginx-app ./nginx-app \
            --namespace ingress-nginx \
            --create-namespace \
            --set replicaCount=2

      - name: Deploy Application 2 - Python Application
        run: |
          helm repo add bitnami https://bitnami.com
          helm repo update
          helm upgrade --install python-release bitnami/python \
            --namespace production-apps \
            --create-namespace \
            --set replicaCount=1' > .github/workflows/deploy.yml
