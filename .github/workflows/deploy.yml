name: Deploy Applications to EKS via Helm

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout GitHub repository
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 3. Connect kubectl to EKS cluster
      - name: Update Kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name kubernets-practice \
            --region ${{ secrets.AWS_REGION }}

      # 4. Install Helm
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.22.0'

      # 5. Deploy Application 1 - Nginx
      - name: Deploy Application 1 - Nginx Web Server
        run: |
          helm lint ./nginx-app

          helm upgrade --install nginx-app ./nginx-app \
            --namespace ingress-nginx \
            --create-namespace \
            --set replicaCount=2

      # 6. Deploy Application 2 - Redis
      - name: Deploy Application 2 - Redis
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update

          helm upgrade --install redis-release bitnami/redis \
            --namespace production-apps \
            --create-namespace \
            --set replica.replicaCount=1 \
            --set master.persistence.enabled=false \
            --set replica.persistence.enabled=false
